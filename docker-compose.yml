services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: stegoshield-backend:latest
    container_name: stegoshield-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
